name: Deploy site to GitHub Pages

# Publishes only the website itself (index.html, css/, js/, data/, audio/).
# The original courseware/*.docx files and tools/ build scripts stay in the
# repo but are never uploaded to the public Pages site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage public site files only
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r css js data audio _site/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
